<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador PWA - Hábitos Atómicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">🔍 Validador PWA - Hábitos Atómicos</h1>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        const checks = [
            {
                name: 'Manifest.json accesible',
                check: async () => {
                    const res = await fetch('/manifest.json');
                    return res.ok && res.headers.get('content-type')?.includes('json');
                }
            },
            {
                name: 'Service Worker registrado',
                check: async () => {
                    return 'serviceWorker' in navigator;
                }
            },
            {
                name: 'HTTPS (requerido para PWA)',
                check: () => location.protocol === 'https:' || location.hostname === 'localhost'
            },
            {
                name: 'Meta viewport presente',
                check: () => document.querySelector('meta[name="viewport"]') !== null
            },
            {
                name: 'Meta theme-color presente',
                check: () => document.querySelector('meta[name="theme-color"]') !== null
            },
            {
                name: 'Meta apple-mobile-web-app-capable',
                check: () => document.querySelector('meta[name="apple-mobile-web-app-capable"]') !== null
            },
            {
                name: 'Link manifest presente',
                check: () => document.querySelector('link[rel="manifest"]') !== null
            },
            {
                name: 'Manifest.json válido',
                check: async () => {
                    const res = await fetch('/manifest.json');
                    const json = await res.json();
                    return json.name && json.short_name && json.start_url && json.display;
                }
            },
            {
                name: 'Service Worker correctamente configurado',
                check: async () => {
                    if (!('serviceWorker' in navigator)) return false;
                    try {
                        const reg = await navigator.serviceWorker.register('/service-worker.js');
                        return !!reg;
                    } catch (e) {
                        return false;
                    }
                }
            },
            {
                name: 'Icons en manifest.json',
                check: async () => {
                    const res = await fetch('/manifest.json');
                    const json = await res.json();
                    return Array.isArray(json.icons) && json.icons.length > 0;
                }
            },
            {
                name: 'localStorage disponible',
                check: () => {
                    try {
                        const test = '__test__';
                        localStorage.setItem(test, test);
                        localStorage.removeItem(test);
                        return true;
                    } catch (e) {
                        return false;
                    }
                }
            }
        ];

        async function runChecks() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="text-gray-600">Validando...</p>';

            const results = [];

            for (const check of checks) {
                try {
                    const result = await check.check();
                    results.push({ name: check.name, passed: result });
                } catch (e) {
                    results.push({ name: check.name, passed: false, error: e.message });
                }
            }

            resultsDiv.innerHTML = results
                .map(r => `
                    <div class="p-4 rounded-lg ${r.passed ? 'bg-green-100 border border-green-300' : 'bg-red-100 border border-red-300'}">
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">${r.passed ? '✅' : '❌'}</span>
                            <span class="font-semibold ${r.passed ? 'text-green-800' : 'text-red-800'}">
                                ${r.name}
                            </span>
                        </div>
                        ${r.error ? `<p class="text-red-700 text-sm mt-1">${r.error}</p>` : ''}
                    </div>
                `)
                .join('');

            const passed = results.filter(r => r.passed).length;
            const total = results.length;

            const summary = document.createElement('div');
            summary.className = 'mt-8 p-6 bg-blue-100 border border-blue-300 rounded-lg';
            summary.innerHTML = `
                <h2 class="text-xl font-bold text-blue-800 mb-2">Resumen</h2>
                <p class="text-blue-800">✅ ${passed}/${total} verificaciones pasadas</p>
                ${passed === total ? '<p class="text-green-700 font-semibold mt-2">🎉 PWA correctamente configurada</p>' : '<p class="text-orange-700 mt-2">⚠️ Hay problemas que corregir</p>'}
            `;
            resultsDiv.insertBefore(summary, resultsDiv.firstChild);
        }

        runChecks();
    </script>
</body>
</html>
